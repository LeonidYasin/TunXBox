<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 840" role="img" aria-labelledby="title desc"><title id="title">Майндмэп TunXBox</title><desc id="desc">Направления проекта и текущие планы; полная текстовая карта доступна в документации.</desc><rect width="1080" height="840" fill="#102633"/><path d="M540 410 L380 85" stroke="#335867" stroke-width="7" fill="none"/><rect x="20" y="20" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="34" y="47" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Интерфейсы</text><path d="M540 410 L380 243" stroke="#335867" stroke-width="7" fill="none"/><rect x="20" y="178" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="34" y="205" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Профили и группы</text><text x="34" y="227" fill="#b6d5df" font-family="Arial" font-size="13">LAN и gateway — PR4 merged, не в stable 1.5.0</text><path d="M540 410 L380 401" stroke="#335867" stroke-width="7" fill="none"/><rect x="20" y="336" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="34" y="363" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Подключение и диагностика</text><text x="34" y="385" fill="#b6d5df" font-family="Arial" font-size="13">TCP REALITY — кандидат Android приёмки</text><text x="34" y="400" fill="#b6d5df" font-family="Arial" font-size="13">Hysteria2 — расследование нестабильности R13</text><text x="34" y="415" fill="#b6d5df" font-family="Arial" font-size="13">Живость RTT ошибки reconnect — план</text><path d="M540 410 L380 559" stroke="#335867" stroke-width="7" fill="none"/><rect x="20" y="494" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="34" y="521" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Маршруты и настройки</text><path d="M540 410 L380 717" stroke="#335867" stroke-width="7" fill="none"/><rect x="20" y="652" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="34" y="679" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">QR и обмен</text><path d="M540 410 L700 135" stroke="#335867" stroke-width="7" fill="none"/><rect x="700" y="70" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="714" y="97" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Архитектура и данные</text><path d="M540 410 L700 309" stroke="#335867" stroke-width="7" fill="none"/><rect x="700" y="244" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="714" y="271" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Сборка и качество</text><text x="714" y="293" fill="#b6d5df" font-family="Arial" font-size="13">Полные сведения commit build signer</text><text x="714" y="308" fill="#b6d5df" font-family="Arial" font-size="13">4KB и 16KB gates</text><path d="M540 410 L700 483" stroke="#335867" stroke-width="7" fill="none"/><rect x="700" y="418" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="714" y="445" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Безопасность</text><path d="M540 410 L700 657" stroke="#335867" stroke-width="7" fill="none"/><rect x="700" y="592" width="360" height="138" rx="12" fill="#173440" stroke="#42626e"/><text x="714" y="619" fill="#eaf3f7" font-family="Arial" font-size="17" font-weight="bold">Экосистема и планы</text><text x="714" y="641" fill="#b6d5df" font-family="Arial" font-size="13">Стабильная 1.5.0</text><text x="714" y="656" fill="#b6d5df" font-family="Arial" font-size="13">Аудит старых веток</text><text x="714" y="671" fill="#b6d5df" font-family="Arial" font-size="13">Новые независимые PR</text><text x="714" y="686" fill="#b6d5df" font-family="Arial" font-size="13">Обновление APK stable/test — кандидат R10</text><text x="714" y="701" fill="#b6d5df" font-family="Arial" font-size="13">Сайт документация и участие</text><text x="714" y="716" fill="#b6d5df" font-family="Arial" font-size="13">Контакт владельца и безопасные отчёты</text><text x="714" y="731" fill="#b6d5df" font-family="Arial" font-size="13">Платное сопровождение — проект условий</text><text x="714" y="746" fill="#b6d5df" font-family="Arial" font-size="13">Монетизация — гипотезы после качества</text><text x="714" y="761" fill="#b6d5df" font-family="Arial" font-size="13">Логический шлюз — отдельный план R11</text><text x="714" y="776" fill="#b6d5df" font-family="Arial" font-size="13">Подписка по фразе — дизайн R14</text><circle cx="540" cy="410" r="67" fill="#73e2da"/><text x="540" y="418" text-anchor="middle" fill="#082326" font-family="Arial" font-weight="bold" font-size="25">TunXBox</text></svg>