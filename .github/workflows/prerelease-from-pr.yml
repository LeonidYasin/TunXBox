# Publishes one rolling pre-release with verified ARM APKs so builds can
# be downloaded and installed BEFORE the PR is merged.
#
# The tag is FIXED per version: vMAJOR.MINOR.PATCH-rc (no run number).
# Each new build re-points the tag onto the current commit and overwrites the
# APK set inside the same release, so Releases always
# shows exactly ONE current pre-release for the branch, with a fresh commit SHA
# and a fresh publishedAt instead of a growing rc1, rc2, ... rcN pile.
#
# Trigger: manual dispatch, or adding the 'publish-rc' label to a PR.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build (default: current ref)'
        required: false
        default: ''

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-publish-prerelease:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'publish-rc')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
      - name: Get actual commit SHA
        id: actual_sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            cd "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest 2>/dev/null || true
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;25.0.8775105" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.0.8775105" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.0.8775105" >> $GITHUB_ENV

      - name: Install Golang (needed for libcore)
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Cache libcore
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('buildScript/lib/**', 'libcore/**') }}
          restore-keys: |
            libcore-${{ runner.os }}-

      - name: Build libcore.aar (if cache miss)
        run: |
          if [ ! -f app/libs/libcore.aar ]; then
            ./run lib core
          else
            echo "libcore.aar restored from cache"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version from nb4a.properties
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION=${VERSION:-1.0.0}
          TAG="v${VERSION}-rc"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Rolling pre-release tag: $TAG"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Cache preview debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: TunXBox-preview-debug-signing-v1

      - name: Build Preview APK
        env:
          BUILD_PLUGIN: none
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease --stacktrace

      - name: Test protocol and remote UI
        run: |
          ./gradlew app:testPreviewDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob("app/build/test-results/testPreviewDebugUnitTest/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          print("JUnit summary: " + ", ".join(f"{key}={value}" for key, value in totals.items()))
          assert totals["tests"] > 0 and totals["failures"] == 0 and totals["errors"] == 0
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TunXBox-ui-test-reports-${{ steps.actual_sha.outputs.sha }}
          path: |
            app/build/reports/tests/testPreviewDebugUnitTest/
            app/build/test-results/testPreviewDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package verified APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_SHA: ${{ steps.actual_sha.outputs.sha }}
        run: |
          set -euo pipefail
          python3 buildScript/test_package_preview_apks.py
          python3 buildScript/package_preview_apks.py \
            --apk-dir app/build/outputs/apk/preview/release \
            --output-dir dist \
            --version "$VERSION" \
            --commit "$BUILD_SHA" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.1/apksigner"

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TunXBox-android-preview-release-${{ steps.actual_sha.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            app/build/outputs/
            app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish rolling pre-release to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.rc_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_SHA: ${{ steps.actual_sha.outputs.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${BUILD_SHA:0:8}"
          NOTES="Rolling pre-release APK for testing before merge.
          Version: ${VERSION}
          Built from commit: ${BUILD_SHA}
          Branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          Platform: Android 5.0+; TV and phone interfaces in the same APK.
          APK choices: arm64-v8a (64-bit ARM), armeabi-v7a (32-bit ARM), and combined APK (see actual ABI list in apk-manifest.json).
          All APK signatures are verified. Preview release may use the CI debug signing key.
          Universal APK includes all four bundled ABIs: ARM32, ARM64, x86 and x86_64 when confirmed by apk-manifest.json.
          Actual filenames match Assets and download filenames; see SHA256SUMS.txt and apk-manifest.json."

          # Roll the git tag onto the CURRENT commit so the release page shows the
          # fresh source revision instead of a stale one. Without this, --clobber
          # updates only the APK asset and the tag keeps pointing at an old SHA.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$BUILD_SHA"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Pre-release $TAG exists - refreshing notes + overwriting APK with the fresh build."
            gh release edit "$TAG" --notes "$NOTES" --target "$BUILD_SHA"
          else
            gh release create "$TAG" \
              --title "TunXBox $TAG (rolling pre-release)" \
              --notes "$NOTES" \
              --target "$BUILD_SHA" \
              --prerelease
          fi
          # Upload the REAL names; #label changes only GitHub display text, not download names.
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt dist/apk-manifest.json --clobber

          # Verify uploaded bytes before removing superseded APKs from this rolling release.
          gh release view "$TAG" --json assets > /tmp/release-assets.json
          mkdir -p verification
          while IFS= read -r name; do
            gh release download "$TAG" --pattern "$name" --dir verification
          done < <(python3 -c 'import json; print("\n".join(a["name"] for a in json.load(open("dist/apk-manifest.json"))["apks"]))')
          python3 - <<'PYVERIFY'
          import json, pathlib, hashlib
          manifest = json.loads(pathlib.Path('dist/apk-manifest.json').read_text())
          assets = json.loads(pathlib.Path('/tmp/release-assets.json').read_text())['assets']
          by_name = {asset['name']: asset for asset in assets}
          for expected in manifest['apks']:
              asset = by_name[expected['name']]
              assert asset['size'] == expected['size'], expected['name']
              with (pathlib.Path('verification') / expected['name']).open('rb') as downloaded:
                  digest = hashlib.file_digest(downloaded, 'sha256').hexdigest()
              assert digest == expected['sha256'], 'Uploaded checksum mismatch: ' + expected['name']
          print('All uploaded APK checksums verified')
          PYVERIFY
          while IFS= read -r name; do
            if [ ! -f "dist/$name" ]; then
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done < <(gh release view "$TAG" --json assets -q '.assets[].name | select(endswith(".apk"))')
          # Finally verify visible names, stored asset names and HTTP download filenames agree.
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" > /tmp/release-final.json
          python3 - <<'PYNAMES'
          import json, pathlib, urllib.parse
          release = json.loads(pathlib.Path('/tmp/release-final.json').read_text())
          expected = {item['name'] for item in json.loads(pathlib.Path('dist/apk-manifest.json').read_text())['apks']}
          actual = set()
          for asset in release['assets']:
              if not asset['name'].endswith('.apk'):
                  continue
              assert asset.get('label') in (None, '', asset['name']), 'Misleading display label'
              assert urllib.parse.unquote(asset['browser_download_url'].rsplit('/', 1)[-1]) == asset['name']
              actual.add(asset['name'])
          assert actual == expected, 'Rolling release contains stale or missing APKs'
          print('Asset names and download URLs agree; no obsolete APKs')
          PYNAMES
          echo "Rolling pre-release ready: $TAG (commit $SHORT_SHA)"
          echo "Release publishedAt: $(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          echo "Release tagName: $(gh release view "$TAG" --json tagName -q .tagName)"

      - name: Comment on PR with RC link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.rc_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh pr comment ${{ github.event.pull_request.number }} --body "Rolling pre-release build is ready.

          Version: $VERSION
          Tag: $TAG
          Download: https://github.com/${{ github.repository }}/releases/tag/$TAG

          This release is refreshed on every build. APKs are signature/checksum verified; obsolete APKs are removed after successful upload."
