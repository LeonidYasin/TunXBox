name: Prepare static Pages branch
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/prepare-static-pages.yml]
permissions:
  contents: write
  pages: write
jobs:
  clean-static-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Keep only public static website in gh-pages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = gh-pages
          test -s index.html
          test -s site.css
          test -s project-map.svg
          test -s guide/roadmap.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Remove inherited application files from this SITE branch only.
          # Worktree/static files remain; no application branch is modified.
          git rm -r --cached --ignore-unmatch . >/dev/null
          git add .nojekyll index.html site.css project-map.svg site-manifest.json guide .github/workflows/prepare-static-pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "Keep gh-pages restricted to static TunXBox website"
            git push origin HEAD:gh-pages
          fi
      - name: Explicitly request Pages build after bot commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
