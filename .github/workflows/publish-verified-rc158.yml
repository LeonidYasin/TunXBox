name: Publish existing verified rc158 artifact
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-rc158
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: TunXBox-android-preview-release-0bd5770d861d72f2e0523eb1c519f6a7bac1816f
          path: recovery-apks
          run-id: 39505780016
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: TunXBox-emulator-smoke-0bd5770d861d72f2e0523eb1c519f6a7bac1816f
          path: recovery-evidence
          run-id: 39505780016
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify original gates, tag, reports and exact APK hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 buildScript/publish_verified_rc158.py
      - name: Verify real APK identity and native alignment again (no signing keys)
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.1'
          python3 buildScript/package_preview_apks.py --apk-dir recovery-apks --output-dir recovery-verified --version 1.6.0 --commit 0bd5770d861d72f2e0523eb1c519f6a7bac1816f --apksigner "$ANDROID_HOME/build-tools/35.0.1/apksigner" --aapt "$ANDROID_HOME/build-tools/35.0.1/aapt" --certificate signing-certificate.sha256 --expected-version-code 48000158
          cmp recovery-apks/apk-manifest.json recovery-verified/apk-manifest.json
          cmp recovery-apks/SHA256SUMS.txt recovery-verified/SHA256SUMS.txt
          python3 buildScript/verify_native_alignment.py recovery-verified/*.apk
      - name: Stage, upload, verify and publish numbered prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v1.6.0-rc.158
          NOTES='Signed TunXBox 1.6.0-rc.158, versionCode 48000158. Exact source: 0bd5770d861d72f2e0523eb1c519f6a7bac1816f. Portrait TV finger scrolling, mouse wheel and return to D-pad: 19/19 UI tests on Android 15 4KB and 19/19 on Android 16 16KB. Real ARM phone/TV acceptance remains pending; this is NOT stable or F-Droid approval. Original verified build: https://github.com/LeonidYasin/TunXBox/actions/runs/39505780016 . APKs reused byte-for-byte; no rebuild or signing-key access. This numbered RC is a manual download, not a replacement of the rolling v1.6.0-rc updater channel.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --title 'TunXBox 1.6.0-rc.158 — portrait TV scroll fix' --notes "$NOTES"
          fi
          gh release upload "$TAG" recovery-verified/*.apk recovery-verified/SHA256SUMS.txt recovery-verified/apk-manifest.json --clobber
          mkdir recovery-download
          gh release download "$TAG" --dir recovery-download
          (cd recovery-download && sha256sum -c SHA256SUMS.txt)
          cmp recovery-verified/apk-manifest.json recovery-download/apk-manifest.json
          test "$(find recovery-download -name '*.apk' | wc -l)" = 3
          gh release edit "$TAG" --draft=false --prerelease --latest=false --notes "$NOTES"
